name: Publish all-in-one image (amd64)

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  push_all_in_one:
    name: Push all-in-one Docker image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image prefix, short SHA and moving tag
        run: |
          echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "MOVING_TAG=stable" >> "$GITHUB_ENV"
          else
            echo "MOVING_TAG=latest" >> "$GITHUB_ENV"
          fi

      - name: Build & push — all-in-one
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./Dockerfile.all-in-one
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/hi.events-all-in-one:${{ env.MOVING_TAG }}
            ${{ env.IMAGE_PREFIX }}/hi.events-all-in-one:${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
